name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: riscv64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build and pack
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          # 去掉标签前的 v，文件名里用 1.0.0 而不是 v1.0.0
          VERSION="${GITHUB_REF_NAME#v}"
          BIN="hello-cli"
          # Windows 可执行文件需要 .exe 后缀
          if [ "$GOOS" = "windows" ]; then
            BIN="hello-cli.exe"
          fi
          mkdir -p dist
          # 把版本号写进二进制里的 main.version
          go build -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${BIN}" .
          cd dist
          # Windows 打 zip，其他系统打 tar.gz
          if [ "$GOOS" = "windows" ]; then
            zip "../hello-cli-${VERSION}-${GOOS}-${GOARCH}.zip" "${BIN}"
          else
            tar -czf "../hello-cli-${VERSION}-${GOOS}-${GOARCH}.tar.gz" "${BIN}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hello-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: hello-cli-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          # 给每个压缩包算一行 sha256
          sha256sum hello-cli-* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/hello-cli-*
            dist/checksums.txt
